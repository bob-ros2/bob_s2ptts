/**:
  ros__parameters:
    model_id: "fishaudio/s2-pro"
    model_dir: "/models"
    sentence_delimiters: [". ", "! ", "? ", "\n"]
    flush_timeout: 700
    temperature: 0.7
    top_p: 0.7
    top_k: 30
    chunk_length: 200
    # Codec runs at 21.5 frames/s (measured: 35 frames = 1.63 s), so 1024 frames
    # ≈ 48 s of audio per chunk. 400 (≈19 s) truncated real sentences: fish-speech
    # logged "Reached max_new_tokens before EOS" on a 186-char sentence that
    # needed 500 frames. The 8192 max_seq_len patch pre-allocates the KV cache for
    # the whole context, so raising this cap does not grow VRAM (17.3 GB used either way).
    max_new_tokens: 1024
    seed: -1
    normalize: true
    precision: "bfloat16"
    compile: false
    warmup: true
    # Eva's shipped delivery: energetic/enthusiastic on every synthesized
    # sentence. Override per call with an inline tag in the text, or silence
    # the preset with "".
    control_instructions: "[excited]"
    play: true
    player: "sys"
    audio_device: ""
    file_prefix: ""
    target_sample_rate: 0
    file_start_index: 1
    sentence_pause: 0.6
    fade_ms: 8
    substitute: [
      "&nbsp;", "",
      "<br>", " ",
      "[\\U00010000-\\U0010ffff\\u2600-\\u27BF\\ufe00-\\ufe0f]", "",
      "https?://\\S+", "",
      "(?m)^\\s*#+\\s*", "",
      "(?m)^\\s*---+\\s*", "",
      "[*~_|<>\\^`]"," ",
      "\\s{2,}", " "
    ]
